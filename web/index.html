<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive verification assistant</title>
<style>
  :root { --ink:#1d1d1f; --muted:#5f6368; --line:#d9dce1; --accent:#2f5bd3; --bg:#f6f7f9; --ok:#1e7d4f; --warn:#a15c00; --bad:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  .stage { font-size:12px; padding:2px 8px; border-radius:10px; background:#eef2fd; color:var(--accent); margin-left:8px; }
  main { max-width:860px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:14px; color:var(--muted); margin:10px 0 4px; }
  input, textarea, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  textarea { min-height:80px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 16px; font:inherit; cursor:pointer; margin-top:12px; }
  button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  button:disabled { opacity:.5; cursor:wait; }
  .tabs button { margin-right:6px; }
  .hidden { display:none; }
  .verdict { font-size:18px; font-weight:600; margin:0 0 8px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; margin-right:6px; background:#eef0f3; }
  .PENDING_REVIEW { background:#fff3e0; color:var(--warn); } .COMPLETED, .APPROVED { background:#e6f4ea; color:var(--ok); }
  .BLOCKED, .REJECTED { background:#fce8e6; color:var(--bad); }
  .muted { color:var(--muted); font-size:14px; }
  .error { color:var(--bad); font-size:14px; margin-top:8px; }
  .row { display:grid; grid-template-columns: 1fr 2fr; gap:12px; }
  pre { background:#f1f3f5; padding:10px; border-radius:6px; overflow:auto; font-size:12px; }
  .samples button { background:#fff; color:var(--ink); border:1px solid var(--line); font-size:13px; padding:5px 10px; margin:4px 4px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Drive verification assistant <span id="stage" class="stage"></span></h1>
  <div id="whoami" class="muted"></div>
</header>
<main>
  <section id="login" class="card">
    <h2 style="margin-top:0">Sign in</h2>
    <p class="muted">Portfolio demo with fictional data. Ask the owner for a demo login.</p>
    <label for="email">Email</label><input id="email" type="email" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div id="loginError" class="error"></div>
  </section>

  <section id="appView" class="hidden">
    <div class="tabs card">
      <button id="tabNew">New case</button>
      <button id="tabQueue" class="secondary hidden">Approval queue</button>
      <button id="logout" class="secondary" style="float:right">Sign out</button>
    </div>

    <section id="newCase" class="card">
      <div class="row">
        <div><label for="serial">Serial number</label><input id="serial" placeholder="ED-1001"></div>
        <div><label for="question">Customer question</label><input id="question" placeholder="My drive failed. Can I get a replacement?"></div>
      </div>
      <div class="samples muted">Try:
        <button data-s="ED-1001" data-q="My drive failed. Can I get a replacement?">In warranty</button>
        <button data-s="ED-1002" data-q="My drive stopped working, can it be replaced?">Expired</button>
        <button data-s="ED-1003" data-q="Is my drive genuine? It failed last week.">Counterfeit</button>
        <button data-s="ED-1004" data-q="Can I get a warranty replacement?">No purchase date</button>
        <button data-s="ED-1006" data-q="Is this drive FIPS certified for a government project?">FIPS question</button>
      </div>
      <button id="runBtn">Check drive</button>
      <div id="runError" class="error"></div>
    </section>

    <section id="result" class="card hidden"></section>

    <section id="queue" class="card hidden">
      <h2 style="margin-top:0">Waiting for review</h2>
      <div id="queueList" class="muted">Loading...</div>
    </section>
  </section>
</main>

<script>
let cfg = null, idToken = null, claims = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function loadConfig() {
  cfg = await (await fetch("config.json", {cache: "no-store"})).json();
  $("stage").textContent = cfg.stage;
  const saved = sessionStorage.getItem("idToken");
  if (saved) setToken(saved);
}

function setToken(token) {
  idToken = token;
  claims = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
  if (claims.exp * 1000 < Date.now()) { sessionStorage.removeItem("idToken"); return; }
  sessionStorage.setItem("idToken", token);
  const groups = claims["cognito:groups"] || [];
  $("whoami").textContent = `${claims.email} · ${groups.join(", ") || "no group"}`;
  $("tabQueue").classList.toggle("hidden", !groups.includes("reviewers"));
  $("login").classList.add("hidden");
  $("appView").classList.remove("hidden");
}

async function login() {
  $("loginError").textContent = "";
  const res = await fetch(`https://cognito-idp.${cfg.region}.amazonaws.com/`, {
    method: "POST",
    headers: {"Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"},
    body: JSON.stringify({AuthFlow: "USER_PASSWORD_AUTH", ClientId: cfg.userPoolClientId,
      AuthParameters: {USERNAME: $("email").value.trim(), PASSWORD: $("password").value}}),
  });
  const data = await res.json();
  if (!res.ok || !data.AuthenticationResult) {
    $("loginError").textContent = data.message || data.ChallengeName || "Sign-in failed.";
    return;
  }
  setToken(data.AuthenticationResult.IdToken);
}

async function api(path, options = {}) {
  const res = await fetch(cfg.apiUrl.replace(/\/$/, "") + path, {
    ...options, headers: {"Content-Type": "application/json", Authorization: idToken, ...(options.headers || {})},
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || body.message || `Request failed (${res.status})`);
  return body;
}

function renderCase(c) {
  const r = c.recommendation || {};
  const cites = (r.citations || []).map(x => `<li>${esc(x.source)}, ${esc(x.section)}</li>`).join("") || "<li>None</li>";
  const reasons = (r.reasons || []).map(x => `<li>${esc(x)}</li>`).join("");
  const overrides = (c.overrides || []).length ? `<p class="muted"><b>Code checks applied:</b> ${c.overrides.map(esc).join(" ")}</p>` : "";
  return `
    <p><span class="pill ${esc(c.status)}">${esc(c.status)}</span><span class="pill">${esc(r.recommended_action)}</span>
       <span class="pill">Authenticity: ${esc(c.authenticity?.status)}</span><span class="pill">Warranty: ${esc(c.warranty?.status)}</span></p>
    <p class="verdict">${esc(r.verdict)}</p>
    <ul>${reasons}</ul>
    <p><b>Tell the customer:</b> ${esc(r.customer_message)}</p>
    <p class="muted"><b>Policy sources:</b></p><ul class="muted">${cites}</ul>
    ${overrides}
    <p class="muted">Case ${esc(c.caseId)} · model ${esc(c.trace?.model_id)} · prompt ${esc(c.trace?.prompt_version)}</p>`;
}

async function runCase() {
  $("runError").textContent = ""; $("runBtn").disabled = true; $("runBtn").textContent = "Checking...";
  try {
    const c = await api("/cases", {method: "POST", body: JSON.stringify({serial: $("serial").value.trim(), question: $("question").value.trim()})});
    $("result").innerHTML = renderCase(c);
    $("result").classList.remove("hidden");
  } catch (e) { $("runError").textContent = e.message; }
  finally { $("runBtn").disabled = false; $("runBtn").textContent = "Check drive"; }
}

async function loadQueue() {
  $("queueList").textContent = "Loading...";
  try {
    const {cases} = await api("/cases?status=PENDING_REVIEW");
    if (!cases.length) { $("queueList").textContent = "Nothing waiting for review."; return; }
    $("queueList").innerHTML = cases.map(c => `
      <div class="card">
        ${renderCase(c)}
        <p class="muted">Opened by ${esc(c.createdBy)} · "${esc(c.question)}"</p>
        <label>Reason</label><input id="why-${esc(c.caseId)}" placeholder="Checked serial and policy">
        <button data-id="${esc(c.caseId)}" data-d="APPROVE">Approve</button>
        <button class="secondary" data-id="${esc(c.caseId)}" data-d="REJECT">Reject</button>
        <div id="err-${esc(c.caseId)}" class="error"></div>
      </div>`).join("");
  } catch (e) { $("queueList").textContent = e.message; }
}

async function decide(id, decision) {
  try {
    await api(`/cases/${id}/decision`, {method: "POST", body: JSON.stringify({decision, reason: $(`why-${id}`).value.trim()})});
    loadQueue();
  } catch (e) { $(`err-${id}`).textContent = e.message; }
}

function show(view) {
  $("newCase").classList.toggle("hidden", view !== "new");
  $("result").classList.toggle("hidden", view !== "new" || !$("result").innerHTML);
  $("queue").classList.toggle("hidden", view !== "queue");
  if (view === "queue") loadQueue();
}

$("loginBtn").onclick = login;
$("password").onkeydown = (e) => { if (e.key === "Enter") login(); };
$("runBtn").onclick = runCase;
$("tabNew").onclick = () => show("new");
$("tabQueue").onclick = () => show("queue");
$("logout").onclick = () => { sessionStorage.removeItem("idToken"); location.reload(); };
document.querySelectorAll(".samples button").forEach(b => b.onclick = () => { $("serial").value = b.dataset.s; $("question").value = b.dataset.q; });
$("queueList").onclick = (e) => { const b = e.target.closest("button[data-id]"); if (b) decide(b.dataset.id, b.dataset.d); };
loadConfig();
</script>
</body>
</html>
